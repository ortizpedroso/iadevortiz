[project]
name = "pkf"
version = "0.3.1"
description = "IA de desenvolvimento multiagente com ciclo spec/build/review"
readme = "PKF.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "networkx>=3.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "greenlet>=3.1.0",
]

[project.scripts]
pkf = "pkf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pkf*"]

[tool.setuptools.package-data]
"pkf.web" = ["static/*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "SIM", "RUF", "FURB", "BLE", "S", "DTZ", "PLW", "PIE"]
ignore = ["RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"pkf/deepseek.py" = ["RUF001"]
"pkf/db/engine.py" = ["PLW0603"]
"pkf/semantic_index.py" = ["PLW0603"]
"pkf/ninerouter.py" = ["S310"]
"pkf/web_search.py" = ["S310"]
"pkf/tools/impl.py" = ["S603"]
"pkf/web/server.py" = ["S104"]
"pkf/tools/registry.py" = ["RUF001"]
