[project]
name = "pkf"
version = "0.2.0"
description = "IA de desenvolvimento multiagente com ciclo spec/build/review"
readme = "PKF.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "networkx>=3.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
pkf = "pkf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pkf*"]

[tool.setuptools.package-data]
"pkf.web" = ["static/*"]
