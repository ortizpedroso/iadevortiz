name: Deploy to VPS

"on":
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Deploy via SSH
        if: env.VPS_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 9m
          script: |
            set -euo pipefail
            cd /opt/pkf
            git pull origin main
            bash deploy/hostinger/update.sh

      - name: Verify deployment health
        if: env.VPS_SSH_KEY != ''
        env:
          HEALTHCHECK_URL: ${{ secrets.VPS_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          url="${HEALTHCHECK_URL}"
          if [ -z "$url" ]; then
            echo "VPS_HEALTHCHECK_URL não definido, pulando health check."
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Health check attempt ${attempt}/3: ${url}"
            if curl -fsS --max-time 30 "${url}"; then
              echo "Health check OK"
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after 3 attempts"
          exit 1

      - name: Deploy secrets ausentes
        if: env.VPS_SSH_KEY == ''
        run: |
          echo "::warning::Deploy automático desativado: secret VPS_SSH_KEY não configurado."
          echo ""
          echo "Na VPS (SSH), rode uma vez:"
          echo "  cd /opt/pkf && git pull origin main"
          echo "  bash deploy/hostinger/bootstrap-github-actions-deploy.sh"
          echo ""
          echo "Cadastre VPS_SSH_KEY em GitHub → Settings → Secrets and variables → Actions"
          echo ""
          echo "Ou instale deploy por cron na VPS:"
          echo "  bash deploy/hostinger/install-cron-deploy.sh"
          echo ""
          echo "Secrets necessários: VPS_SSH_KEY, VPS_HOST (IP ou hostname da VPS)"
          echo "Recomendação: use um usuário de deploy limitado (não root) com sudo restrito."
