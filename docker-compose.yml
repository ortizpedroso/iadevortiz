services:
  pkf:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PKF_ENV: production
      PKF_HOST: 0.0.0.0
      PKF_PORT: 8765
      PKF_NO_BROWSER: "1"
      PKF_PROVIDER: ${PKF_PROVIDER:-kimi}
    volumes:
      - pkf-workspace:/data/workspace
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      pkf:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/pkf.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pkf-workspace:
