<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PKF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z" />
            <path d="M12 12l8-4.5M12 12v9M12 12L4 7.5" />
          </svg>
        </span>
        <div>
          <strong>PKF</strong>
          <span>IA de desenvolvimento</span>
        </div>
      </div>

      <button class="btn-new" id="new-chat" type="button">Novo projeto</button>

      <section class="side-block project-block">
        <h2>Projeto atual</h2>
        <p id="meta-project">Nenhum ainda</p>
      </section>
    </aside>

    <div class="workspace-area">
      <header class="topbar">
        <button class="icon-btn" id="toggle-sidebar" type="button" aria-label="Abrir ou fechar menu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <div class="topbar-title">
          <span id="header-status">Pronto</span>
          <span class="dot" id="conn-dot" data-state="off" aria-label="Status da conexão"></span>
        </div>
        <div class="preview-actions" id="preview-actions" hidden>
          <button type="button" class="btn-preview" id="preview-side">Ver ao lado</button>
          <a class="btn-preview external" id="preview-external" href="#" target="_blank" rel="noopener">Abrir no navegador ↗</a>
        </div>
      </header>

      <div class="content-split" id="content-split">
        <div class="chat-pane">
          <div class="banner" id="provider-banner" hidden></div>
          <div class="progress-banner" id="progress-banner" hidden></div>

          <main class="thread" id="thread" tabindex="0">
            <div class="empty" id="empty-state">
              <h1>O que vamos construir?</h1>
              <p>Descreva seu app, site ou funcionalidade. A PKF cuida do resto.</p>
              <div class="suggestions">
                <button type="button" data-fill="Cardápio digital whitelabel para restaurantes">Cardápio digital</button>
                <button type="button" data-fill="Landing page para startup de IA">Landing page</button>
                <button type="button" data-fill="Painel admin com login e dashboard">Painel admin</button>
              </div>
            </div>
            <div class="messages" id="messages" hidden></div>
          </main>

          <footer class="composer-wrap">
            <form class="composer" id="composer">
              <label class="sr-only" for="prompt">Mensagem para a PKF</label>
              <textarea id="prompt" rows="1" placeholder="Descreva o que você quer construir…"></textarea>
              <button class="send" type="submit" id="send" aria-label="Enviar" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
              </button>
            </form>
            <p class="hint">Enter envia · Shift+Enter quebra linha</p>
          </footer>
        </div>

        <aside class="preview-pane" id="preview-pane" hidden>
          <header class="preview-pane-header">
            <strong>Preview do projeto</strong>
            <button type="button" class="icon-btn" id="close-preview" aria-label="Fechar preview">✕</button>
          </header>
          <iframe id="preview-frame" title="Preview do projeto" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
        </aside>
      </div>
    </div>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
